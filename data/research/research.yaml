- title: "Subsidy Design and Carbon Pricing: Evidence from India's Coal Allocation"
  pdflink: "/research/jmp_deshwal.pdf"
  # coauthors: "" 
  book: "Working Paper"
  year: "2026"
  links: 
    - url: "/research/jmp_deshwal.pdf"
      text: "Paper"
  abstract: > 
   Economists widely endorse carbon pricing to internalize climate change-related externalities. Yet carbon prices often coexist with energy subsidies. In India's electricity industry, coal is subsidized through administered prices and rationed supply contracts that favor state-owned generators, so the cleanest generators, most of them private, face the highest fuel costs. This paper estimates how the design of this subsidy impacts the effectiveness and welfare gains of carbon pricing. I measure the producer-level distortion the subsidy creates directly, and recover the wholesale electricity supply curve from cost and contract data, exploiting regulation that ties contracted generators' prices to their fuel costs and to specific buyers. Given obstacles to first-best energy pricing, I evaluate a subsidy redesign that keeps the current subsidy's transfers to incumbent generators but gives every generator the same price of coal at the margin. The redesign reduces CO$_2$ emissions by 14.6 million tonnes a year, more than a $40 per tonne carbon tax, and increases welfare by $4.7 billion a year, 1.8 times the gain from the tax. A carbon tax achieves less because the current design lowers costs most for the dirtiest generators, and the tax must first offset this advantage before it changes which generators produce. Findings suggest that in settings where energy subsidies persist, their design can itself serve as climate policy.

- title: "Barriers to Industrial Growth and Long-Run Productive Efficiency: The Role of Policy-Induced Misallocation"
  pdflink: "/research/coalentry_deshwal_luo.pdf"
  coauthors: "Tianyu Luo" 
  book: "Working Paper"
  year: "2026"
  links: 
    - url: "/research/coalentry_deshwal_luo.pdf"
      text: "Paper"
  abstract: > 
   We study how government-created distortions in upstream coal markets affect capacity investment and productivity in India's electricity industry. The government coal monopoly administratively allocates subsidized coal primarily to inefficient state-owned plants while forcing efficient private generators to purchase coal at market prices often 1.5-2 times higher. This unequal access distorts not only the allocation of electricity production today, but also incentives to invest in new generating capacity. Using plant-level data for 2006-2017 and detailed administrative records of coal supply contracts, we estimate a dynamic oligopoly model of capacity investment for coal-fired generators. We use the estimated model to quantify how eliminating distortions would change investment and the long-run productivity of the electricity sector.

- title: "Feasible Reform of a Persistent Distortion: The Political Economy of Coal Allocation in India"
  pdflink: "/research/polecon_deshwal.pdf"
  book: "Working Paper"
  year: "2026"
  links: 
    - url: "/research/polecon_deshwal.pdf"
      text: "Paper"
  abstract: > 
   India allocates coal to power plants at notified prices through rationed supply contracts that favour state-owned generators, so the cleanest and most efficient generators pay the most for their fuel. The arrangement has survived governments of every political stripe. I argue that it persists because Coal India Ltd (CIL) is a common agent: it answers to several principals with conflicting claims, including the fiscal authority, the coal-bearing states, the cheap-power constituency and the states that own generators, and the result is governance by prohibition rather than by incentive. The state solved the commitment problem for private investors in electricity but never in coal, and reforms that ignored a principal's claim were reversed. A feasible reform must leave each principal no worse off on the dimension it controls, either by compensating principals within the existing prohibitions or by giving each its own instrument. I evaluate one reform of each kind, both with precedents in Indian policy. A compensatory tariff and a deregulation of coal prices paired with direct benefit transfers to consumers produce the same reallocation of generation, a $4.7 billion annual welfare gain and a 14.6 million tonne annual reduction in CO$_2$ emissions. The first costs the central budget $4.9 billion a year and lowers electricity bills by $7.3 billion; in the second, CIL's higher revenue funds the transfers, so neither consumers nor the central budget is worse off. In both, state-owned generators lose a fifth of their output, worth at most 0.38 percent of any state's GDP.
   
workinprogress:
- title: "Designing Dynamic Pricing for Renewable Integration: Evidence from Linked Electricity and Water Markets"
  pdflink: ""
  coauthors: "Bhavya Srivastava"
  abstract: >
    Dynamic pricing mechanisms are theoretically efficient for aligning electricity demand with renewable supply, but recent empirical evidence suggests consumers exhibit limited responsiveness due to adjustment costs and information frictions. This paper examines when command-and-control policies may achieve efficient load shifting. We study Gujarat's Kisan Suryodaya Yojana, which provides daytime electricity to farmers for irrigation in a setting where adjustment costs are near zero. Using synthetic control with seven comparison states, we find evidence of a 7-11 MU increase in solar generation post-policy. Descriptive analysis shows peak demand share increased approximately 1.5 percentage point, with peak demand growing disproportionately relative to off-peak demand. To quantify the equilibrium impacts on costs and market efficiency, we develop an empirical model of electricity production for the state's wholesale electricity market. The findings suggest command-and-control policies may be effective for flexible-demand centers with low adjustment costs.

