- title: "Distortions and Emissions: When Fixing Market Failures Beats Taxing Carbon"
  pdflink: "/research/draft_coal_distortions.pdf"
  # coauthors: "" 
  book: "Working Paper"
  year: "2025"
  links: 
    - url: "/research/draft_coal_distortions.pdf"
      text: "Paper"
  abstract: > 
   Optimal climate policy such as carbon pricing works by efficiently reallocating production to reflect social costs. India's electricity generation industry is a large and growing source of global CO$_2$ emissions, but unlike developed country markets, its marginal social cost curve is flat rather than upward sloping. I show that the subsidized allocation of domestic coal to dirty public sector generators is a key source of this distortion - public generators receive coal at 40% of international prices while efficient private generators must pay 2.5 times more despite showing 10--15% higher efficiency, resulting in $4 billion in annual misallocation. Because the dirtiest producers are also the cheapest, subsidies cancel the carbon price signal before it changes which plants produce at the margin, leaving the observed MSC far from its efficient benchmark—a gap no standard carbon tax is large enough to close. I build an empirical model of India's electricity generation industry that captures generator incentives, binding long-term contracts, and grid operator optimization to estimate equilibrium quantities across generators and counterfactual policies. Coal price deregulation achieves CO$_2$ reductions equivalent to a $40/tonne carbon tax while generating welfare gains 2.4 times larger ($8.9 billion annually) and reallocating 20% of production from the dirtiest to the cleanest generators, compared to only 2.5% under the tax. At every tax rate from $20-100/tonne, removing subsidies first would allow carbon taxes to achieve 130-270% greater emissions reductions, representing $3.8 billion in avoidable annual climate damages. A Pareto improving reform combining deregulation with consumer transfers yields net welfare gains of $1.9 billion. Findings suggest that in highly distorted economies, efficiency-enhancing reforms can serve as environmental policy itself.

- title: "How Government Resource Allocation Rules Shape Industry Dynamics [Draft available soon!]"
  pdflink: ""
  coauthors: "Tianyu Luo" 
  book: "Working Paper"
  year: "2025"
  abstract: > 
   We study how government-created distortions in upstream coal markets affect long-run productivity growth in India's electricity industry. The government coal monopoly administratively allocates subsidized coal primarily to inefficient state-owned plants while forcing efficient private generators to purchase coal at market prices often 1.5-2 times higher. Using plant-level data for 2006-2017 and detailed administrative records of coal supply contracts, we measure productivity and distortions directly, avoiding empirical challenges associated with production function estimation. Coal policy changes reduced expected subsidized coal access for private generators from 90% to 38% during this period of substantial private entry. We estimate a dynamic oligopoly model for coal-fired generators that recovers firms' beliefs about future coal availability and quantify how these distortions affected investment decisions. Preliminary findings suggest that removing these distortions affects long-run productivity growth through two distinct mechanisms: (i) direct reallocation from subsidized inefficient state plants to unsubsidized efficient private plants, and (ii) increased investment by efficient private generators responding to improved expected profitability. Together, coal price deregulation would significantly alter the long-run distribution of productivity and aggregate industry outcomes.
   
workinprogress:
- title: "Designing Dynamic Pricing for Renewable Integration: Evidence from Linked Electricity and Water Markets"
  pdflink: ""
  coauthors: "Bhavya Srivastava"
  abstract: >
    Dynamic pricing mechanisms are theoretically efficient for aligning electricity demand with renewable supply, but recent empirical evidence suggests consumers exhibit limited responsiveness due to adjustment costs and information frictions. This paper examines when command-and-control policies may achieve efficient load shifting. We study Gujarat's Kisan Suryodaya Yojana, which provides daytime electricity to farmers for irrigation in a setting where adjustment costs are near zero. Using synthetic control with seven comparison states, we find evidence of a 7-11 MU increase in solar generation post-policy. Descriptive analysis shows peak demand share increased approximately 1.5 percentage point, with peak demand growing disproportionately relative to off-peak demand. To quantify the equilibrium impacts on costs and market efficiency, we develop an empirical model of electricity production for the state's wholesale electricity market. The findings suggest command-and-control policies may be effective for flexible-demand centers with low adjustment costs.

